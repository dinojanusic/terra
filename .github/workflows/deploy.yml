name: Deploy to GitHub Pages

# The Actions token may create deployments but not the Pages site itself, so
# this publishes to a gh-pages branch instead of using the Pages API. GitHub
# serves that branch for public repositories.
on:
  push:
    branches: [claude/terra-restoran-landing-ay3lzt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' ./ "$site/"
          touch "$site/.nojekyll"          # serve the files as they are, no Jekyll pass
          cd "$site"
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" gh-pages
